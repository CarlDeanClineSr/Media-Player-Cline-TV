<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<title>CLINE CLASSIC TV</title>
<style>
:root{--green:#00ff66}*{box-sizing:border-box}
html,body{margin:0;background:#0a0a0a;color:#eee;font-family:"Courier New",Courier,monospace;min-height:100%;overflow:auto}
body{display:flex;align-items:center;justify-content:center;padding:12px}
button,input,select{font:inherit}button,input{touch-action:manipulation}
#cabinet{width:min(96vw,1368px);background:#0f0f0f;border:16px solid #0a0a0a;border-radius:28px;box-shadow:0 60px 100px #000,inset 0 0 140px #000;display:grid;grid-template-columns:minmax(260px,1fr) 280px;gap:12px;padding:24px;position:relative}
.glass-tube{width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;border:14px solid #1c1c1c;box-shadow:inset 0 0 90px #000,0 0 50px #000;position:relative;align-self:center}
video{width:100%;height:100%;object-fit:contain;background:#000;position:relative;z-index:3}
#crt-overlay{position:absolute;inset:0;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.25) 50%),linear-gradient(90deg,rgba(255,0,0,.06),rgba(0,255,0,.02),rgba(0,0,255,.06));background-size:100% 4px,3px 100%;box-shadow:inset 0 0 80px rgba(0,0,0,.9),inset 0 0 20px rgba(255,255,255,.1);border-radius:10px;pointer-events:none;z-index:30}
#static-overlay{position:absolute;inset:0;background:#ddd;opacity:0;z-index:20;pointer-events:none}
#static-overlay.active{opacity:.14;animation:static .08s infinite}
@keyframes static{0%{transform:translate(0)}25%{transform:translate(-3px,2px)}50%{transform:translate(2px,-2px)}75%{transform:translate(3px,1px)}100%{transform:translate(0)}}
#osd{position:absolute;top:12px;left:12px;color:var(--green);font-size:clamp(12px,2vw,17px);font-weight:bold;text-shadow:2px 2px #000,0 0 8px var(--green);z-index:40;pointer-events:none;opacity:0;transition:opacity .25s;max-width:90%}
#osd.show{opacity:1}
.right-panel{background:#000;border:1px solid #222;border-radius:10px;padding:12px 6px;display:grid;grid-template-columns:180px 44px;gap:8px;align-items:center;justify-content:center}
.knob-column{display:flex;flex-direction:column;align-items:center;gap:14px}
.dial-label{font-size:14px;text-align:center;color:#eee}
.dial-housing{position:relative;width:140px;height:145px;display:flex;align-items:center;justify-content:center}
.knob{width:74px;height:74px;padding:0;min-height:0;background:#1f1f1f;border:10px solid #0f0f0f;border-radius:50%;cursor:pointer;box-shadow:0 8px 20px #000;position:relative;z-index:5}
.knob::after{content:"";position:absolute;top:50%;left:50%;width:4px;height:28px;background:#ddd;transform:translate(-50%,-50%);transform-origin:center top}
.number-ring{position:absolute;width:200px;height:200px;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.tick{position:absolute;width:2px;height:8px;background:#777;top:50%;left:50%;transform-origin:center center;opacity:.8}
.number{position:absolute;width:32px;height:32px;text-align:center;line-height:32px;font-size:16px;font-weight:bold;color:#eee;text-shadow:0 0 5px #000;transform:translate(-50%,-50%);pointer-events:none}
#channel-readout{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font-size:22px;color:var(--green);font-weight:bold;text-shadow:0 0 8px var(--green)}
.volume-container{width:130px;height:32px;background:#222;border:5px solid #111;border-radius:20px;display:flex;align-items:center;justify-content:center}
.volume-slider{width:105px;height:6px;background:#444;appearance:none}
.volume-slider::-webkit-slider-thumb{width:22px;height:22px;background:#ccc;border-radius:50%;border:4px solid #111;appearance:none}
#next-title{width:100%;font-size:13px;line-height:1.4;overflow-wrap:anywhere;text-align:center;min-height:18px}
.toolbar{display:flex;flex-direction:column;align-items:center;gap:14px}
.mini-button{position:relative;display:grid;place-items:center;width:44px;height:44px;min-height:44px;padding:0;border:0;background:transparent;color:#e2dfd5;font-family:Arial,sans-serif;font-size:16px;border-radius:50%;cursor:pointer}
.mini-button::before{content:"";position:absolute;z-index:-1;width:26px;height:26px;border-radius:50%;border:2px solid #777;background:linear-gradient(#424242,#171717);box-shadow:0 3px 5px #000,inset 0 1px 2px #aaa}
.mini-button:hover::before{border-color:#ccc}.mini-button[aria-pressed=true]{color:var(--green)}.mini-button[aria-pressed=true]::before{border-color:var(--green)}
#now-title{text-align:center;font-size:13px;line-height:1.3;grid-column:1/-1;color:#ddd}
dialog{width:min(92vw,760px);max-height:80vh;background:#111;color:#eee;border:2px solid #555;border-radius:10px;padding:18px;box-shadow:0 20px 80px #000}
dialog::backdrop{background:rgba(0,0,0,.75)}
.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.dialog-top h2{margin:0;font-size:20px;color:var(--green)}
.dialog-top button,.guide-filters button{background:#161616;color:#eee;border:1px solid #666;border-radius:6px;padding:8px 12px;cursor:pointer}
.guide-filters{display:grid;grid-template-columns:1fr 180px;gap:10px;margin:15px 0}.guide-filters label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#aaa}.guide-filters input,.guide-filters select{background:#050505;color:#eee;border:1px solid #555;border-radius:5px;padding:9px}
#guide-results{display:grid;gap:6px;max-height:52vh;overflow:auto}
.guide-item{display:grid;grid-template-columns:55px 1fr auto;gap:10px;align-items:center;text-align:left;background:#181818;border:1px solid #444;color:#eee;padding:10px;border-radius:5px;cursor:pointer}
.guide-item:hover{border-color:var(--green)}.guide-ch{color:var(--green);font-weight:bold}.guide-item small{color:#999}
#guide-count{color:#aaa;font-size:12px}
#share-url{width:100%;margin:12px 0;background:#050505;color:#eee;border:1px solid #555;padding:10px}
@media(max-width:768px){body{padding:4px}#cabinet{width:100%;grid-template-columns:1fr;padding:12px;border-width:8px;border-radius:18px}.right-panel{grid-template-columns:minmax(180px,1fr) 44px}.glass-tube{border-width:9px}.guide-filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="cabinet">
<div class="glass-tube">
<div id="static-overlay"></div><div id="crt-overlay"></div><div id="osd">STANDBY</div>
<video id="player" controls playsinline webkit-playsinline preload="metadata" aria-label="Cline TV player"></video>
</div>
<div class="right-panel">
<div class="knob-column">
<div><div class="dial-label">PROGRAM</div><div class="dial-housing"><div class="number-ring" id="program-ring"></div><button class="knob" id="program-knob" aria-label="Next program"></button></div><div id="next-title"></div></div>
<label><span class="dial-label">VOLUME</span><span class="volume-container"><input type="range" min="0" max="1" step=".01" value=".7" class="volume-slider" id="volume"></span></label>
<div><div class="dial-label">CHANNEL</div><div class="dial-housing"><div class="number-ring" id="channel-ring"></div><button class="knob" id="channel-knob" aria-label="Next channel"></button><span id="channel-readout">1</span></div></div>
</div>
<div class="toolbar">
<button class="mini-button" id="guide-btn" title="Program guide">☷</button>
<button class="mini-button" id="restart-btn" title="Start over">↺</button>
<button class="mini-button" id="favorite-btn" title="Favorite channel" aria-pressed="false">★</button>
<button class="mini-button" id="previous-btn" title="Previous channel">↶</button>
<button class="mini-button" id="share-btn" title="Share program">↗</button>
<button class="mini-button" id="fs-btn" title="Full screen">⛶</button>
</div>
<div id="now-title"></div>
</div>
<dialog id="guide"><div class="dialog-top"><h2>PROGRAM GUIDE</h2><button id="guide-close">Close</button></div>
<div class="guide-filters"><label>Search programs<input id="guide-search" type="search" placeholder="Title or channel"></label><label>Channel<select id="guide-channel"></select></label></div>
<p id="guide-count"></p><div id="guide-results"></div></dialog>
<dialog id="share-dialog"><div class="dialog-top"><h2>SHARE PROGRAM</h2><button id="share-close">Close</button></div><input id="share-url" readonly><button id="copy-share">Copy link</button><p id="share-status"></p></dialog>
</main>

const player=document.getElementById("player"), programLabel=document.getElementById("next-title"), osd=document.getElementById("osd");
let channelIndex=0, programIndex=0, previousChannel=0, current=null;
const favorites=new Set(JSON.parse(localStorage.getItem("clineTVFavorites")||"[]"));
let volume=Number(localStorage.getItem("clineTVVolume")||.7); document.getElementById("volume").value=volume; player.volume=volume;
function save(){localStorage.setItem("clineTVFavorites",JSON.stringify([...favorites]));localStorage.setItem("clineTVVolume",volume)}
function flash(t){osd.textContent=t;osd.classList.add("show");clearTimeout(flash.timer);flash.timer=setTimeout(()=>osd.classList.remove("show"),1800)}
function showStatic(){const s=document.getElementById("static-overlay");s.classList.add("active");setTimeout(()=>s.classList.remove("active"),180)}
function play(i=programIndex,autoplay=true){const list=channels[channelIndex].items;if(!list.length){player.removeAttribute("src");programLabel.textContent="CHANNEL NOT PROGRAMMED";return}
 programIndex=(i+list.length)%list.length;current=list[programIndex];player.src=current.url;player.load();programLabel.textContent="NEXT: "+(list[(programIndex+1)%list.length]?.title||"—");document.getElementById("now-title").textContent=current.title;
 flash("CH "+String(channelIndex+1).padStart(2,"0")+"  "+channels[channelIndex].name);showStatic();
 if(autoplay) player.play().catch(()=>{});
 updateFavorite();
}
function changeProgram(step){play(programIndex+step)}
function changeChannel(step){previousChannel=channelIndex;channelIndex=(channelIndex+step+channels.length)%channels.length;programIndex=0;play(0)}
function previous(){const t=channelIndex;channelIndex=previousChannel;previousChannel=t;programIndex=0;play(0)}
function toggleFavorite(){if(favorites.has(channelIndex))favorites.delete(channelIndex);else favorites.add(channelIndex);save();updateFavorite();flash(favorites.has(channelIndex)?"CHANNEL FAVORITE":"FAVORITE REMOVED")}
function updateFavorite(){const b=document.getElementById("favorite-btn");b.setAttribute("aria-pressed",favorites.has(channelIndex));document.getElementById("channel-readout").textContent=channelIndex+1}
function restart(){player.currentTime=0;player.play().catch(()=>{});flash("START OVER")}
function share(){const u=new URL(location.href);u.hash="ch="+(channelIndex+1)+"&p="+programIndex;document.getElementById("share-url").value=u.href;document.getElementById("share-dialog").showModal()}
function openFromHash(){const m=location.hash.match(/ch=(\d+)&p=(\d+)/);if(m){channelIndex=Math.max(0,Math.min(channels.length-1,Number(m[1])-1));programIndex=Math.max(0,Number(m[2]));}}
function ticks(id,count){const r=document.getElementById(id);for(let i=0;i<count;i++){const t=document.createElement("i");t.className="tick";t.style.transform="translate(-50%,-50%) rotate("+i*360/count+"deg) translateY(-94px)";r.appendChild(t)}}
function numbers(id,count){const r=document.getElementById(id);for(let i=1;i<=count;i++){const n=document.createElement("b");n.className="number";const a=(i-1)*360/count*Math.PI/180;n.textContent=i;n.style.left=(50+44*Math.sin(a))+"%";n.style.top=(50-44*Math.cos(a))+"%";r.appendChild(n)}}
ticks("program-ring",26);ticks("channel-ring",12);numbers("channel-ring",12);
function renderGuide(){const q=document.getElementById("guide-search").value.toLowerCase(), sel=document.getElementById("guide-channel").value;let rows=[];channels.forEach((ch,ci)=>{if(sel!=="all"&&Number(sel)!==ci)return;ch.items.forEach((x,pi)=>{if(q&&!((x.title+" "+ch.name+" "+(ci+1)).toLowerCase().includes(q)))return;rows.push({x,ci,pi})})});document.getElementById("guide-count").textContent=rows.length+" programs";document.getElementById("guide-results").innerHTML=rows.map(r=>'<button class="guide-item" data-ci="'+r.ci+'" data-pi="'+r.pi+'"><span class="guide-ch">CH '+String(r.ci+1).padStart(2,"0")+'</span><span>'+r.x.title+'<br><small>'+channels[r.ci].name+'</small></span><span>▶</span></button>').join("");document.querySelectorAll(".guide-item").forEach(b=>b.onclick=()=>{channelIndex=Number(b.dataset.ci);programIndex=Number(b.dataset.pi);document.getElementById("guide").close();play(programIndex)})}
function openGuide(){const s=document.getElementById("guide-channel");s.innerHTML='<option value="all">All channels</option>'+channels.map((c,i)=>'<option value="'+i+'">CH '+String(i+1).padStart(2,"0")+" — "+c.name+"</option>").join("");document.getElementById("guide-search").value="";renderGuide();document.getElementById("guide").showModal()}
document.getElementById("program-knob").onclick=()=>changeProgram(1);document.getElementById("program-knob").oncontextmenu=e=>(e.preventDefault(),changeProgram(-1));
document.getElementById("channel-knob").onclick=()=>changeChannel(1);document.getElementById("channel-knob").oncontextmenu=e=>(e.preventDefault(),changeChannel(-1));
document.getElementById("guide-btn").onclick=openGuide;document.getElementById("restart-btn").onclick=restart;document.getElementById("favorite-btn").onclick=toggleFavorite;document.getElementById("previous-btn").onclick=previous;document.getElementById("share-btn").onclick=share;
document.getElementById("fs-btn").onclick=()=>{if(!document.fullscreenElement)document.getElementById("cabinet").requestFullscreen?.();else document.exitFullscreen?.()};
document.getElementById("volume").oninput=e=>{volume=Number(e.target.value);player.volume=volume;save()};
document.getElementById("guide-close").onclick=()=>document.getElementById("guide").close();document.getElementById("share-close").onclick=()=>document.getElementById("share-dialog").close();
document.getElementById("copy-share").onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById("share-url").value);document.getElementById("share-status").textContent="Copied."}catch{document.getElementById("share-url").select();document.getElementById("share-status").textContent="Select and copy the link."}};
document.getElementById("guide-search").oninput=renderGuide;document.getElementById("guide-channel").onchange=renderGuide;
document.addEventListener("keydown",e=>{if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName))return;if(e.key==="ArrowUp"){e.preventDefault();changeProgram(1)}else if(e.key==="ArrowDown"){e.preventDefault();changeProgram(-1)}else if(e.key==="PageDown"){e.preventDefault();changeChannel(1)}else if(e.key==="PageUp"){e.preventDefault();changeChannel(-1)}else if(e.key==="p"||e.key==="P"){previous()}});
openFromHash();play(programIndex);
</script>
