body{height:auto;min-height:100dvh;overflow:auto;display:block;padding:12px;color:#eee}

<body>
<main id="cabinet">
  <div class="glass-tube">
    <div id="audio-stage"><canvas id="audio-scope" aria-hidden="true"></canvas><div id="radio-mode-label">AUDIO SCOPE</div></div><div id="internal-show" aria-live="polite"><div id="internal-show-title"></div><div id="internal-show-scroll"></div></div>
    <div id="static-overlay"></div><div id="crt-overlay"></div><div id="osd">STANDBY</div>
    <video id="player" controls playsinline webkit-playsinline preload="metadata" aria-label="TV player"></video>
    <audio id="audio-player" controls preload="metadata" aria-label="Radio player"></audio>
  </div>
  <div class="right-panel">
    <div class="knob-column">
    <div class="program-dial"><div class="dial-label">PROGRAM</div><div class="dial-housing"><div class="number-ring" id="t-ring"></div><button class="knob" id="t-knob" aria-label="Next program; right-click or swipe down for previous" onkeydown="if(event.key==='ArrowLeft'||event.key==='ArrowDown'){event.preventDefault();tune(-1);}else if(event.key==='ArrowRight'||event.key==='ArrowUp'){event.preventDefault();tune(1);}" onclick="tune(1)" oncontextmenu="event.preventDefault();tune(-1);"></button></div><div id="next-title" hidden></div></div>
    <label><span class="dial-label">VOLUME</span><span class="volume-container"><input type="range" min="0" max="1" step="0.01" value="0.7" class="volume-slider" id="volume-knob" aria-label="Volume" oninput="changeVolume(this.value)"></span></label>
    <div class="channel-dial"><div class="dial-label">CHANNEL</div><div class="dial-housing"><div class="number-ring" id="s-ring" aria-hidden="true"></div><button class="knob" id="s-knob" aria-label="Next channel; right-click or swipe down for previous" onkeydown="if(event.key==='ArrowLeft'||event.key==='ArrowDown'){event.preventDefault();changeCategory(-1);}else if(event.key==='ArrowRight'||event.key==='ArrowUp'){event.preventDefault();changeCategory(1);}" onclick="changeCategory(1)" oncontextmenu="event.preventDefault();changeCategory(-1);"></button><span id="channel-readout" aria-hidden="true">1</span></div></div>
    </div>
    <div class="toolbar" aria-label="Playback controls">
      <button class="mini-button" onclick="openGuide()" id="guide-open" title="Program guide" aria-label="Program guide">☷</button>
      <button class="mini-button" onclick="restartProgram()" title="Start over" aria-label="Start over">↺</button>
      <button class="mini-button" onclick="toggleFavorite()" id="favorite" aria-pressed="false" title="Favorite channel" aria-label="Favorite channel">★</button>
      <button class="mini-button" onclick="shareSelection()" title="Share program" aria-label="Share program">↗</button>
      <button class="mini-button" onclick="toggleFS()" title="Full screen" aria-label="Full screen">⛶</button>
      <button class="mini-button" onclick="retryCurrent()" id="retry-play" title="Retry" aria-label="Retry" hidden>⟳</button>
      <button class="mini-button" onclick="resumeCurrent()" id="resume-play" title="Tap to play" aria-label="Tap to play" hidden>▶</button>
    </div>
    <strong id="now-title" hidden></strong><div id="playback-status" class="sr-only" role="status" aria-live="polite"></div>
  </div>
  <dialog id="guide" aria-labelledby="guide-heading">
    <div class="dialog-top"><h2 id="guide-heading">Program guide</h2><button onclick="document.getElementById('guide').close()">Close</button></div>
    <div class="guide-filters"><label>Search programs<input id="guide-search" type="search" placeholder="Title or channel" oninput="renderGuide()"></label><label>Channel<select id="guide-channel" onchange="renderGuide()"><option value="all">All channels</option><option value="favorites">Favorite channels</option></select></label></div>
    <p id="guide-count" role="status"></p><div id="guide-results"></div><button id="guide-more" onclick="showMoreGuide()" hidden>Show more programs</button>
  </dialog>
  <dialog id="share-dialog" aria-labelledby="share-heading"><div class="dialog-top"><h2 id="share-heading">Share this program</h2><button onclick="document.getElementById('share-dialog').close()">Close</button></div><label for="share-url">Link to this program and playback time</label><input id="share-url" readonly onclick="this.select()"><button onclick="copyShareLink()">Copy link</button><p id="share-status" role="status" class="hint"></p></dialog>
</main>

}
const preferences=readPreferences();

function currentItem(){return categories[currentCategoryIndex].content[currentVideoIndex];}
function active(s=session){return s && session===s && s.generation===generation;}

// Short display labels only: original catalog titles and media URLs stay intact.

function nextSelection(){return currentVideoIndex+1<categories[currentCategoryIndex].content.length?[currentCategoryIndex,currentVideoIndex+1]:[(currentCategoryIndex+1)%categories.length,0];}
function choose(ci,vi,{time,delay=true,automatic=false}={}){

// Metadata establishes duration/resume state, NOT whether video has decoded.
// Picture checks wait for five seconds of visible, advancing playback.
const PICTURE_GRACE_SECONDS=5, PICTURE_POLL_MS=500;
function stopPictureCheck(s){

function watchPictureFrame(s){
    if(!active(s)||s.audioMode||s.pictureSeen||s.rejecting||s.frameRequest!=null)return;

    try{

    if(failedSelections.size>=total){

        document.getElementById('retry-play').hidden=false;return;
    }
    setStatus('No video picture — skipping this TV entry.');

function checkPicture(s){

            if(!active(s))return;

            s.controller.abort();clearTimeout(s.watchdog);clearTimeout(s.skipTimer);stopPictureCheck(s);s.media.pause();loadAndPlay(resume,retries);
        },4000);
    }else{
        failedSelections.add(selectionKey(s.ci,s.vi));
        const total=categories.reduce((n,c)=>n+c.content.length,0);
        if(failedSelections.size>=total){setStatus('Sources unavailable. Choose a program or press Retry.');document.getElementById('retry-play').hidden=false;return;}
        setStatus('Source unavailable — moving to the next program.');
        s.retryTimer=setTimeout(()=>{if(active(s)){const [ci,vi]=nextSelection();choose(ci,vi,{time:0,automatic:true});}},2000);
    }
}
function resumeCurrent(){if(active())attemptPlay(session);else retryCurrent();}
function retryCurrent(){const time=active()?(session.ready?validTime(session.media.currentTime):session.resume):undefined;choose(currentCategoryIndex,currentVideoIndex,{time,delay:false});}
function restartProgram(){choose(currentCategoryIndex,currentVideoIndex,{time:0,delay:false});}
function tune(dir){playClickSound();const c=categories[currentCategoryIndex];choose(currentCategoryIndex,(currentVideoIndex+dir+c.content.length)%c.content.length);}
function selectChannel(ci){
    if(!Number.isInteger(ci)||ci<0||ci>=categories.length)return;
    playClickSound();const saved=savedChannel(categories[ci]),vi=Math.max(0,programIds[ci].indexOf(saved.id));choose(ci,vi);
}
function changeCategory(dir){selectChannel((currentCategoryIndex+dir+categories.length)%categories.length);}
function enableKnobSwipe(knob,turn){
    let start=null,suppressClick=false;
    knob.style.touchAction='none';
    knob.addEventListener('pointerdown',e=>{
        if(e.pointerType==='mouse')return;
        start={id:e.pointerId,x:e.clientX,y:e.clientY};suppressClick=false;
        if(knob.setPointerCapture)knob.setPointerCapture(e.pointerId);
    });
    knob.addEventListener('pointerup',e=>{
        if(!start||e.pointerId!==start.id)return;
        const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;
        if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
        suppressClick=true;e.preventDefault();turn(Math.abs(dy)>=Math.abs(dx)?(dy<0?1:-1):(dx>0?1:-1));
    });
    knob.addEventListener('pointercancel',()=>{start=null;suppressClick=false;});
    knob.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false;}},true);
}
function changeVolume(v){v=Math.min(1,Math.max(0,Number(v)));if(!Number.isFinite(v))return;preferences.volume=v;preferences.muted=false;volumeKnob.value=String(v);if(active()){session.media.volume=v;session.media.muted=false;}persist();}
function toggleFavorite(){const c=categories[currentCategoryIndex].name;preferences.favorites=preferences.favorites.includes(c)?preferences.favorites.filter(x=>x!==c):[...preferences.favorites,c];persist();updateNow();}
function openGuide(){renderGuide();document.getElementById('guide').showModal();document.getElementById('guide-search').focus();}
const GUIDE_BATCH=100;
let guideMatches=[],guideShown=0;
function renderGuide(){
    const q=document.getElementById('guide-search').value.trim().toLowerCase(),filter=document.getElementById('guide-channel').value;
    document.getElementById('guide-results').replaceChildren();guideMatches=[];guideShown=0;
    categories.forEach((c,ci)=>{
        if(filter==='favorites'&&!preferences.favorites.includes(c.name) || filter!=='all'&&filter!=='favorites'&&filter!==c.name)return;
        c.content.forEach((item,vi)=>{if(!q||`${item.n} ${c.label}`.toLowerCase().includes(q))guideMatches.push({ci,vi});});
    });
    showMoreGuide();
}
function showMoreGuide(){
    const results=document.getElementById('guide-results'),fragment=document.createDocumentFragment();
    const end=Math.min(guideShown+GUIDE_BATCH,guideMatches.length);
    for(;guideShown<end;guideShown++){
        const {ci,vi}=guideMatches[guideShown],c=categories[ci],item=c.content[vi],b=document.createElement('button');
        b.textContent=`CH ${c.name} · ${vi+1}. ${item.n}`;b.title=item.n;
        b.setAttribute('aria-current',String(ci===currentCategoryIndex&&vi===currentVideoIndex));
        b.addEventListener('click',()=>{document.getElementById('guide').close();choose(ci,vi,{delay:false});});fragment.appendChild(b);
    }
    results.appendChild(fragment);
    document.getElementById('guide-more').hidden=guideShown>=guideMatches.length;
    document.getElementById('guide-count').textContent=guideMatches.length?`${guideMatches.length} programs · Showing ${guideShown} · Choose a title to play`:'No matching programs.';
}
function shareSelection(){
    const hash=new URLSearchParams({ch:categories[currentCategoryIndex].name,program:programIds[currentCategoryIndex][currentVideoIndex],t:String(Math.floor(active()&&session.ready?validTime(session.media.currentTime):active()?session.resume:0))});
    const url=new URL(location.href);url.hash=hash.toString();
    document.getElementById('share-url').value=url.href;document.getElementById('share-status').textContent='Copy this link, or select it and copy manually.';
    document.getElementById('share-dialog').showModal();
}
async function copyShareLink(){const input=document.getElementById('share-url');try{await navigator.clipboard.writeText(input.value);document.getElementById('share-status').textContent='Link copied.';}catch{input.focus();input.select();document.getElementById('share-status').textContent='Select and copy the link above.';}}
function parseSelection(hash){
    const p=new URLSearchParams(hash.replace(/^#/,''));if(!p.has('ch')&&!p.has('program'))return null;
    const ci=categories.findIndex(c=>c.name===p.get('ch'));if(ci<0)return false;
    const vi=programIds[ci].indexOf(p.get('program'));if(vi<0)return false;
    const t=Number(p.get('t')||0);return{ci,vi,time:validTime(t)};
}
let playerOrientationLocked=false;
function releasePlayerOrientation(){
    if(!playerOrientationLocked)return;
    playerOrientationLocked=false;
    try{window.screen?.orientation?.unlock?.();}catch{/* The browser may already have released it. */}
}
async function requestLandscape(){
    const orientation=window.screen?.orientation;
    if(!orientation?.lock)return;
    try{
        await orientation.lock('landscape');playerOrientationLocked=true;
        if(!document.fullscreenElement&&!player.webkitDisplayingFullscreen)releasePlayerOrientation();
    }catch{/* Native video controls and physical rotation remain available. */}
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)releasePlayerOrientation();});
player.addEventListener('webkitendfullscreen',releasePlayerOrientation);
async function toggleFS(){
    try{
        if(document.fullscreenElement){await document.exitFullscreen();releasePlayerOrientation();return;}
        if(player.webkitDisplayingFullscreen&&player.webkitExitFullscreen){player.webkitExitFullscreen();releasePlayerOrientation();return;}
        const phone=!!window.matchMedia?.('(pointer: coarse)').matches && !!window.matchMedia?.('(max-width: 900px), (max-height: 600px)').matches;
        const videoMode=categories[currentCategoryIndex].kind==='video';
        // Use the same native video view as the in-video enlarge button on phones.
        // Call the Apple API directly during the tap, before awaiting anything.
        if(phone&&videoMode&&player.webkitEnterFullscreen){player.webkitEnterFullscreen();void requestLandscape();return;}
        const target=phone&&videoMode?player:document.getElementById('cabinet');
        if(target.requestFullscreen){await target.requestFullscreen();if(phone)await requestLandscape();return;}
        if(videoMode&&player.webkitEnterFullscreen){player.webkitEnterFullscreen();return;}
        setStatus('Full screen is unavailable in this browser.');
    }catch{setStatus('Full screen is unavailable. Use the player controls.');}
}
function playClickSound() {
    if(!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if(!AudioContext) return;
        audioCtx = new AudioContext();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(Number(volumeKnob.value) * 0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

function playStaticSound() {
    if(!audioCtx) return;
    const n = audioCtx.sampleRate * 0.35;
    const b = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0; i<n; i++) d[i] = Math.random() * 2 - 1;
    const s = audioCtx.createBufferSource();
    const f = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();
    s.buffer = b; f.type = 'lowpass'; f.frequency.value = 2500;
    g.gain.value = Number(volumeKnob.value) * 0.2;
    s.connect(f); f.connect(g); g.connect(audioCtx.destination);
    s.start();
}

function makeTicks(id, count) {
    const r = document.getElementById(id);
    r.innerHTML = '';
    const step = 360 / count;
    for(let i=0; i<count; i++){
        const t = document.createElement('div');
        t.className = 'tick';
        t.style.transform = `translate(-50%,-50%) rotate(${i*step}deg) translateY(calc(-1 * var(--tick-radius,60px)))`;
        r.appendChild(t);
    }
}

const AUDIO_EXTENSIONS = ['.mp3','.m4a','.aac','.ogg','.oga','.wav','.flac','.opus'];
function isAudio(url) {
    const p = String(url).split(/[?#]/,1)[0].toLowerCase();
    return AUDIO_EXTENSIONS.some(x => p.endsWith(x));
}

function seededRandom(seed){let v=seed>>>0;return()=>{v=(1664525*v+1013904223)>>>0;return v/4294967296}}
function hashText(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function buildRadioStars(title){const rnd=seededRandom(hashText(title||'CLINE RADIO'));radioStars=[];for(let i=0;i<90;i++)radioStars.push({x:rnd(),y:rnd(),size:.45+rnd()*1.6,phase:rnd()*Math.PI*2,drift:.25+rnd()*.75})}
function resizeAudioScope(){const r=audioScope.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.floor(r.width*d)),h=Math.max(1,Math.floor(r.height*d));if(audioScope.width!==w||audioScope.height!==h){audioScope.width=w;audioScope.height=h}return{width:w,height:h,dpr:d}}
function drawAudioScope(){if(!audioStage.classList.contains('active')){audioScopeFrame=null;return}const c=audioScope.getContext('2d'),{width:w,height:h,dpr:d}=resizeAudioScope(),t=Number.isFinite(audioPlayer.currentTime)?audioPlayer.currentTime:0,m=(!audioPlayer.paused&&!audioPlayer.ended)?1:.08,now=performance.now()/1000;c.clearRect(0,0,w,h);for(const s of radioStars){const tw=.32+.68*Math.abs(Math.sin(now*s.drift+s.phase));c.beginPath();c.fillStyle=`rgba(170,255,220,${.15+tw*.55})`;c.arc(s.x*w,((s.y+now*s.drift*.0015)%1)*h,s.size*d,0,Math.PI*2);c.fill()}const cx=w/2,cy=h*.5,span=w*.37,bars=48,bw=Math.max(1.2*d,span/bars*.55);c.strokeStyle='rgba(0,255,120,.20)';c.lineWidth=Math.max(1,d);c.beginPath();c.moveTo(cx-span,cy);c.lineTo(cx+span,cy);c.stroke();for(let i=0;i<bars;i++){const q=i/(bars-1),voice=Math.abs(Math.sin(t*6.2+i*.73))*.46+Math.abs(Math.sin(t*2.3+i*.31))*.29+Math.abs(Math.sin(t*11.7+i*1.07))*.25,env=.4+.6*Math.abs(Math.sin(t*.91+i*.04)),edge=Math.pow(Math.sin(q*Math.PI),.42),amp=h*.22*edge*(.1+m*voice*env),x=(i+.5)*(span/bars),a=.3+.6*edge;c.fillStyle=`rgba(0,255,120,${a})`;c.fillRect(cx+x,cy-amp,bw,amp*2);c.fillRect(cx-x-bw,cy-amp,bw,amp*2)}const p=(.5+.5*Math.sin(t*3.4))*m;c.strokeStyle=`rgba(0,255,150,${.22+p*.42})`;c.lineWidth=Math.max(1.2*d,2);c.beginPath();c.arc(cx,cy,(24+p*34)*d,0,Math.PI*2);c.stroke();audioScopeFrame=requestAnimationFrame(drawAudioScope)}
function startAudioScope(item){buildRadioStars(item.n);audioStage.classList.add('active');if(audioScopeFrame===null)audioScopeFrame=requestAnimationFrame(drawAudioScope)}
function stopAudioScope(){audioStage.classList.remove('active');if(audioScopeFrame!==null){cancelAnimationFrame(audioScopeFrame);audioScopeFrame=null}}

window.addEventListener('resize',()=>{if(audioStage.classList.contains('active'))resizeAudioScope()});


window.addEventListener('pagehide',savePosition);
document.addEventListener('visibilitychange',()=>{if(document.hidden)savePosition();});
window.addEventListener('hashchange',()=>{const p=parseSelection(location.hash);if(p)choose(p.ci,p.vi,{time:p.time,delay:false});else if(p===false)setStatus('That shared program is not in this catalog. Open Guide to choose one.');});
window.onload=()=>{
    makeTicks('t-ring',100);makeTicks('s-ring',categories.length);
    enableKnobSwipe(document.getElementById('t-knob'),tune);enableKnobSwipe(document.getElementById('s-knob'),changeCategory);
    const volume=preferences.volume;volumeKnob.value=String(typeof volume==='number'&&Number.isFinite(volume)&&volume>=0&&volume<=1?volume:0.7);
    categories.forEach(c=>{const o=document.createElement('option');o.value=c.name;o.textContent=`CH ${c.name} · ${c.label}`;document.getElementById('guide-channel').appendChild(o);});
    const p=parseSelection(location.hash);
    if(p)choose(p.ci,p.vi,{time:p.time,delay:false});
    else {const ci=Math.max(0,categories.findIndex(c=>c.name===preferences.lastChannel)),saved=savedChannel(categories[ci]);choose(ci,Math.max(0,programIds[ci].indexOf(saved.id)),{delay:false});if(p===false)setStatus('Shared program not found. Open Guide to choose one.');}
};
