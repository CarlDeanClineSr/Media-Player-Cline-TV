<script>
// ==========================================
// CLINE TV SHOW SYSTEM · SOURCE CATALOG
// ==========================================
const mk = (p, a) => { let r=[]; for(let i=0;i<a.length;i+=2) r.push({n:a[i], u:p+a[i+1]}); return r; };
const mks = (a) => { let r=[]; for(let i=0;i<a.length;i+=2) r.push({n:a[i], u:a[i+1]}); return r; };

// CLINE TV — LIBRARY-DRIVEN SHOW SYSTEM
// The repository's organized CHANNEL_LIBRARY is the authoritative programming source.
// This page reads the channel sections at runtime; it does not maintain a second 178-item catalog.
const SHOW_SYSTEM_VERSION = "LIBRARY-18";
const CHANNEL_LIBRARY_PATH = "library/CHANNEL_LIBRARY.md";
let categories = [];
let programIds = [];

function parseChannelLibrary(markdown) {
    const channels = [];
    let current = null;
    for (const rawLine of String(markdown).split(/\r?\n/)) {
        const line = rawLine.trimEnd();
        const heading = line.match(/^##\s+CH\s+(\d+)\s+—\s+(.+)$/);
        if (heading) {
            current = {
                name: String(Number(heading[1])),
                label: heading[2].trim(),
                kind: "mixed",
                content: []
            };
            channels.push(current);
            continue;
        }
        // The review-hold section is deliberately not broadcast until reviewed.
        if (/^##\s+REVIEW HOLD\b/i.test(line)) {
            current = null;
            continue;
        }
        if (!current) continue;
        const entry = line.match(/^\s*-\s+(.+?)\s+—\s+(https?:\/\/.*)$/);
        if (!entry) continue;
        const title = entry[1].trim();
        const url = entry[2].trim();
        if (!title || !url) continue;
        current.content.push({n:title,u:url});
    }
    return channels
        .filter(c => c.content.length)
        .sort((a,b) => Number(a.name)-Number(b.name));
}

async function loadChannelLibrary() {
    const response = await fetch(CHANNEL_LIBRARY_PATH, {cache:"default"});
    if (!response.ok) throw new Error(`Channel library request failed (${response.status})`);
    const markdown = await response.text();
    const loaded = parseChannelLibrary(markdown);
    const seen = new Set();
    let total = 0;
    for (const channel of loaded) {
        const unique = [];
        for (const item of channel.content) {
            if (seen.has(item.u)) continue;
            seen.add(item.u);
            unique.push(item);
        }
        channel.content = unique;
        channel.kind = "mixed";
        total += unique.length;
    }
    categories = loaded;
    programIds = categories.map(c => {
        const occurrences = new Map();
        return c.content.map(item => {
            const base = item.id || itemId(item.u);
            const n = (occurrences.get(base) || 0) + 1;
            occurrences.set(base, n);
            return base + "-" + n;
        });
    });
    if (!categories.length) throw new Error("Channel library contains no broadcast channels.");
    console.info(`CLINE TV catalog loaded: ${total} programs across ${categories.length} channels.`);
    return total;
}
// ==========================================
// SHOW SYSTEM ENGINE & AUDIO SYNTHESIS
// ==========================================
// V188 groups preserved source arrays by content type. IDs derive from URLs within each public channel.
let currentCategoryIndex=0, currentVideoIndex=0, tunerDeg=0, categoryDeg=0;
let audioCtx=null, audioScopeFrame=null, radioStars=[], osdTimeout;
const player=document.getElementById('player'), audioPlayer=document.getElementById('audio-player');
const volumeKnob=document.getElementById('volume-knob'), audioStage=document.getElementById('audio-stage'), audioScope=document.getElementById('audio-scope');
const MAX_RETRIES=4, STORAGE_KEY='cline-tv-show-system-1';
let session=null, generation=0, transitionTimer=null, lastSave=0;
const failedSelections=new Set();
function readPreferences(){
    try { const p=JSON.parse(localStorage.getItem(STORAGE_KEY)); return p && typeof p==='object' && !Array.isArray(p) ? p : {}; } catch { return {}; }
}
const preferences=readPreferences();
if(!preferences.channels || typeof preferences.channels!=='object' || Array.isArray(preferences.channels)) preferences.channels={};
if(!Array.isArray(preferences.favorites)) preferences.favorites=[];
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(preferences));}catch{/* Playback works when browser storage is unavailable. */}}
function savedChannel(c){const p=preferences.channels[c.name];return p && typeof p==='object'?p:{};}
function validTime(t){return typeof t==='number' && Number.isFinite(t) && t>=0 ? t : 0;}
function itemId(url){return hashText(url).toString(36)+'-'+hashText([...url].reverse().join('')).toString(36);}
/* programIds are built by loadChannelLibrary(). */

function currentItem(){return categories[currentCategoryIndex].content[currentVideoIndex];}
function active(s=session){return s && session===s && s.generation===generation;}
function savePosition(){

function cancelSession(){

// Short display labels only: original catalog titles and media URLs stay intact.
function displayTitle(title, limit=52){
    const clean=String(title).replace(/\.(mp4|mkv|avi|mp3|m4a)$/i,'')
        .replace(/\[(?:\d{3,4}p|HD|SD|BluRay|WEB-DL|x264|x265)\]/gi,'')
        .replace(/_/g,' ').replace(/\s+/g,' ').trim();
    return clean.length>limit?clean.slice(0,limit-1).trimEnd()+'…':clean;
}
function updateTitleDisplay(text, transient=false){
    const c=categories[currentCategoryIndex],o=document.getElementById('osd');
    const [nextCI,nextVI]=nextSelection();
    const title=displayTitle(currentItem().n);
    const notice=text && text!==currentItem().n ? `\n${text}` : '';
    o.textContent=`CH ${c.name} · ${currentVideoIndex+1}/${c.content.length}\n${title}${notice}\nNEXT: ${displayTitle(categories[nextCI].content[nextVI].n,46)}`;

    const [ci,vi]=nextSelection();

    document.getElementById('favorite').setAttribute('aria-pressed',String(preferences.favorites.includes(c.name)));

function nextSelection(){return currentVideoIndex+1<categories[currentCategoryIndex].content.length?[currentCategoryIndex,currentVideoIndex+1]:[(currentCategoryIndex+1)%categories.length,0];}
function choose(ci,vi,{time,delay=true,automatic=false}={}){

    savePosition();cancelSession();
    currentCategoryIndex=ci;currentVideoIndex=vi;
    if(!automatic)failedSelections.clear();
    const saved=savedChannel(categories[ci]);
    const resume=time===undefined && saved.id===programIds[ci][vi]?validTime(saved.time):validTime(time);
    preferences.lastChannel=categories[ci].name;persist();updateNow();
    document.getElementById('retry-play').hidden=true;document.getElementById('resume-play').hidden=true;
    const overlay=document.getElementById('static-overlay');overlay.classList.toggle('active',delay);
    setStatus('Loading…');

// Metadata establishes duration/resume state, NOT whether video has decoded.
// Picture checks wait for five seconds of visible, advancing playback.
const PICTURE_GRACE_SECONDS=5, PICTURE_POLL_MS=500;
function stopPictureCheck(s){
    clearTimeout(s.pictureTimer);s.pictureTimer=null;
    if(s.frameRequest!=null && typeof s.media.cancelVideoFrameCallback==='function'){
        try{s.media.cancelVideoFrameCallback(s.frameRequest);}catch{/* Source may already be unloaded. */}
    }

}
function confirmPicture(s){
    if(!active(s)||s.rejecting||s.pictureSeen)return;
    s.pictureSeen=true;stopPictureCheck(s);
    s.retries=0;failedSelections.clear();
    if(s.isPlaying)setStatus('',true);
}
function watchPictureFrame(s){
    if(!active(s)||s.audioMode||s.pictureSeen||s.rejecting||s.frameRequest!=null)return;
    if(typeof s.media.requestVideoFrameCallback!=='function')return;
    try{
        s.frameApi=true;
        s.frameRequest=s.media.requestVideoFrameCallback((_now,frame)=>{
            s.frameRequest=null;
            if(!active(s)||s.rejecting)return;
            if(frame.width>0&&frame.height>0)confirmPicture(s);
            else watchPictureFrame(s);
        });
    }catch{s.frameApi=false;}
}
function skipNoPicture(s){
    if(!active(s)||s.rejecting)return;

    s.rejecting=true;s.ready=false;stopPictureCheck(s);
    clearTimeout(s.watchdog);clearTimeout(s.retryTimer);s.retryTimer=null;
    s.media.pause();stopAudioScope();
    failedSelections.add(selectionKey(s.ci,s.vi));
    const total=categories.reduce((n,c)=>n+c.content.length,0);
    if(failedSelections.size>=total){
        setStatus('No playable picture found. Choose a program or press Retry.');
        document.getElementById('retry-play').hidden=false;return;
    }
    setStatus('No video picture — skipping this TV entry.');
    s.skipTimer=setTimeout(()=>{

            const [ci,vi]=nextSelection();choose(ci,vi,{time:0,automatic:true});

function checkPicture(s){
    if(!active(s)||s.audioMode||s.rejecting||s.pictureSeen)return;
    clearTimeout(s.pictureTimer);s.pictureTimer=null;
    const media=s.media,dimensions=media.videoWidth>0&&media.videoHeight>0;
    let frameCountsAvailable=false;
    if(dimensions&&typeof media.getVideoPlaybackQuality==='function'){
        try{
            const q=media.getVideoPlaybackQuality();
            frameCountsAvailable=Number.isFinite(q.totalVideoFrames)&&Number.isFinite(q.droppedVideoFrames);
            if(frameCountsAvailable&&q.totalVideoFrames>q.droppedVideoFrames){confirmPicture(s);return;}
        }catch{/* Fall back only when a frame counter is unavailable. */}
    }
    if(dimensions&&!s.frameApi&&!frameCountsAvailable&&media.readyState>=2){confirmPicture(s);return;}
    const now=performance.now(),position=validTime(media.currentTime);
    const advancing=s.isPlaying&&!media.paused&&!media.ended&&!media.seeking&&!document.hidden&&media.readyState>=2;

        // Clamp timer gaps and ignore seek jumps; loading/paused/hidden time is not playback.
        const elapsed=Math.max(0,Math.min(1000,now-s.pictureClock))/1000;
        const delta=position-s.pictureTime,rate=Number.isFinite(media.playbackRate)&&media.playbackRate>0?media.playbackRate:1;

    }
    s.pictureClock=advancing?now:null;s.pictureTime=advancing?position:null;
    if(s.pictureElapsed>=PICTURE_GRACE_SECONDS){skipNoPicture(s);return;}
    if(s.isPlaying)s.pictureTimer=setTimeout(()=>checkPicture(s),PICTURE_POLL_MS);
}
function loadAndPlay(time=0,retries=0){
    const item=currentItem();

        player.style.display='none';audioPlayer.style.display='none';stopAudioScope();
        const overlay=document.getElementById('internal-show');
        document.getElementById('internal-show-title').textContent=item.n;
        const scroll=document.getElementById('internal-show-scroll');
        scroll.textContent=item.showText||'';
        scroll.style.animation='none';void scroll.offsetWidth;scroll.style.animation='';
        overlay.classList.add('active');
        const controller=new AbortController();
        const s={generation,ci:currentCategoryIndex,vi:currentVideoIndex,media:{pause(){},paused:false,ended:false,currentTime:0,duration:Number(item.duration)||8},audioMode:false,controller,retryTimer:null,watchdog:null,skipTimer:null,pictureTimer:null,frameRequest:null,frameApi:false,pictureSeen:true,pictureElapsed:0,pictureClock:null,pictureTime:null,isPlaying:true,rejecting:false,retries,ready:true,resume:0};

        controller:new AbortController(),retryTimer:null,watchdog:null,skipTimer:null,
        pictureTimer:null,frameRequest:null,frameApi:false,pictureSeen:false,pictureElapsed:0,
        pictureClock:null,pictureTime:null,isPlaying:false,rejecting:false,retries,ready:false,resume:time};

        if(audioMode||s.pictureSeen){s.retries=0;failedSelections.clear();}

        setStatus(audioMode||s.pictureSeen?'':'Checking video picture…',true);

    const suspendPicture=()=>{s.isPlaying=false;s.pictureClock=null;s.pictureTime=null;clearTimeout(s.pictureTimer);s.pictureTimer=null;};
    listen('waiting',()=>{suspendPicture();if(!media.paused){setStatus('Buffering…');armWatchdog(s);}});
    listen('stalled',()=>{suspendPicture();if(!media.paused){setStatus('Waiting for the media source…');armWatchdog(s);}});

function armWatchdog(s){clearTimeout(s.watchdog);s.watchdog=setTimeout(()=>{if(active(s)&&!s.media.paused)handleArchiveError(s);},30000);}
function attemptPlay(s){
    if(!active(s)||s.rejecting)return;
    armWatchdog(s);

        if(!active(s)||e.name==='AbortError')return;
        if(e.name==='NotAllowedError'){clearTimeout(s.watchdog);setStatus('Tap to play — your browser needs a button press.');document.getElementById('resume-play').hidden=false;}
        else handleArchiveError(s);
    });
}
function handleArchiveError(s){

    clearTimeout(s.watchdog);
    if(s.retries<MAX_RETRIES){
        s.retries++;setStatus(`Source unavailable — retry ${s.retries}/${MAX_RETRIES} in 4 seconds.`);

        if(failedSelections.size>=total){setStatus('Sources unavailable. Choose a program or press Retry.');document.getElementById('retry-play').hidden=false;return;}
        setStatus('Source unavailable — moving to the next program.');
        s.retryTimer=setTimeout(()=>{if(active(s)){const [ci,vi]=nextSelection();choose(ci,vi,{time:0,automatic:true});}},2000);

function resumeCurrent(){if(active())attemptPlay(session);else retryCurrent();}
function retryCurrent(){const time=active()?(session.ready?validTime(session.media.currentTime):session.resume):undefined;choose(currentCategoryIndex,currentVideoIndex,{time,delay:false});}
function restartProgram(){choose(currentCategoryIndex,currentVideoIndex,{time:0,delay:false});}
function tune(dir){playClickSound();const c=categories[currentCategoryIndex];choose(currentCategoryIndex,(currentVideoIndex+dir+c.content.length)%c.content.length);}
function selectChannel(ci){

function changeCategory(dir){selectChannel((currentCategoryIndex+dir+categories.length)%categories.length);}
function enableKnobSwipe(knob,turn){
    let start=null,suppressClick=false;
    knob.style.touchAction='none';
    knob.addEventListener('pointerdown',e=>{
        if(e.pointerType==='mouse')return;
        start={id:e.pointerId,x:e.clientX,y:e.clientY};suppressClick=false;
        if(knob.setPointerCapture)knob.setPointerCapture(e.pointerId);
    });
    knob.addEventListener('pointerup',e=>{
        if(!start||e.pointerId!==start.id)return;
        const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;
        if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
        suppressClick=true;e.preventDefault();turn(Math.abs(dy)>=Math.abs(dx)?(dy<0?1:-1):(dx>0?1:-1));
    });
    knob.addEventListener('pointercancel',()=>{start=null;suppressClick=false;});
    knob.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false;}},true);

function changeVolume(v){v=Math.min(1,Math.max(0,Number(v)));if(!Number.isFinite(v))return;preferences.volume=v;preferences.muted=false;volumeKnob.value=String(v);if(active()){session.media.volume=v;session.media.muted=false;}persist();}
function toggleFavorite(){const c=categories[currentCategoryIndex].name;preferences.favorites=preferences.favorites.includes(c)?preferences.favorites.filter(x=>x!==c):[...preferences.favorites,c];persist();updateNow();}
function openGuide(){renderGuide();document.getElementById('guide').showModal();document.getElementById('guide-search').focus();}
const GUIDE_BATCH=100;
let guideMatches=[],guideShown=0;
function renderGuide(){
    const q=document.getElementById('guide-search').value.trim().toLowerCase(),filter=document.getElementById('guide-channel').value;
    document.getElementById('guide-results').replaceChildren();guideMatches=[];guideShown=0;
    categories.forEach((c,ci)=>{

function showMoreGuide(){

    for(;guideShown<end;guideShown++){
        const {ci,vi}=guideMatches[guideShown],c=categories[ci],item=c.content[vi],b=document.createElement('button');

let playerOrientationLocked=false;
function releasePlayerOrientation(){
    if(!playerOrientationLocked)return;
    playerOrientationLocked=false;
    try{window.screen?.orientation?.unlock?.();}catch{/* The browser may already have released it. */}
}
async function requestLandscape(){
    const orientation=window.screen?.orientation;
    if(!orientation?.lock)return;
    try{
        await orientation.lock('landscape');playerOrientationLocked=true;
        if(!document.fullscreenElement&&!player.webkitDisplayingFullscreen)releasePlayerOrientation();

}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)releasePlayerOrientation();});

async function toggleFS(){
    try{
        if(document.fullscreenElement){await document.exitFullscreen();releasePlayerOrientation();return;}
        if(player.webkitDisplayingFullscreen&&player.webkitExitFullscreen){player.webkitExitFullscreen();releasePlayerOrientation();return;}
        const phone=!!window.matchMedia?.('(pointer: coarse)').matches && !!window.matchMedia?.('(max-width: 900px), (max-height: 600px)').matches;
        const videoMode=!isAudio(currentItem().u);
        // Use the same native video view as the in-video enlarge button on phones.
        // Call the Apple API directly during the tap, before awaiting anything.
        if(phone&&videoMode&&player.webkitEnterFullscreen){player.webkitEnterFullscreen();void requestLandscape();return;}
        const target=phone&&videoMode?player:document.getElementById('cabinet');
        if(target.requestFullscreen){await target.requestFullscreen();if(phone)await requestLandscape();return;}
        if(videoMode&&player.webkitEnterFullscreen){player.webkitEnterFullscreen();return;}
        setStatus('Full screen is unavailable in this browser.');
    }catch{setStatus('Full screen is unavailable. Use the player controls.');}
}
function playClickSound() {
    if(!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if(!AudioContext) return;
        audioCtx = new AudioContext();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(Number(volumeKnob.value) * 0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

function playStaticSound() {
    if(!audioCtx) return;
    const n = audioCtx.sampleRate * 0.35;
    const b = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0; i<n; i++) d[i] = Math.random() * 2 - 1;
    const s = audioCtx.createBufferSource();
    const f = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();
    s.buffer = b; f.type = 'lowpass'; f.frequency.value = 2500;
    g.gain.value = Number(volumeKnob.value) * 0.2;
    s.connect(f); f.connect(g); g.connect(audioCtx.destination);
    s.start();
}

function makeTicks(id, count) {
    const r = document.getElementById(id);
    r.innerHTML = '';
    const step = 360 / count;
    for(let i=0; i<count; i++){
        const t = document.createElement('div');
        t.className = 'tick';
        t.style.transform = `translate(-50%,-50%) rotate(${i*step}deg) translateY(calc(-1 * var(--tick-radius,60px)))`;
        r.appendChild(t);
    }
}

const AUDIO_EXTENSIONS = ['.mp3','.m4a','.aac','.ogg','.oga','.wav','.flac','.opus'];
function isAudio(url) {
    const p = String(url).split(/[?#]/,1)[0].toLowerCase();
    return AUDIO_EXTENSIONS.some(x => p.endsWith(x));
}

function seededRandom(seed){let v=seed>>>0;return()=>{v=(1664525*v+1013904223)>>>0;return v/4294967296}}

function buildRadioStars(title){const rnd=seededRandom(hashText(title||'CLINE RADIO'));radioStars=[];for(let i=0;i<90;i++)radioStars.push({x:rnd(),y:rnd(),size:.45+rnd()*1.6,phase:rnd()*Math.PI*2,drift:.25+rnd()*.75})}
function resizeAudioScope(){const r=audioScope.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.floor(r.width*d)),h=Math.max(1,Math.floor(r.height*d));if(audioScope.width!==w||audioScope.height!==h){audioScope.width=w;audioScope.height=h}return{width:w,height:h,dpr:d}}
function drawAudioScope(){if(!audioStage.classList.contains('active')){audioScopeFrame=null;return}const c=audioScope.getContext('2d'),{width:w,height:h,dpr:d}=resizeAudioScope(),t=Number.isFinite(audioPlayer.currentTime)?audioPlayer.currentTime:0,m=(!audioPlayer.paused&&!audioPlayer.ended)?1:.08,now=performance.now()/1000;c.clearRect(0,0,w,h);for(const s of radioStars){const tw=.32+.68*Math.abs(Math.sin(now*s.drift+s.phase));c.beginPath();c.fillStyle=`rgba(170,255,220,${.15+tw*.55})`;c.arc(s.x*w,((s.y+now*s.drift*.0015)%1)*h,s.size*d,0,Math.PI*2);c.fill()}const cx=w/2,cy=h*.5,span=w*.37,bars=48,bw=Math.max(1.2*d,span/bars*.55);c.strokeStyle='rgba(0,255,120,.20)';c.lineWidth=Math.max(1,d);c.beginPath();c.moveTo(cx-span,cy);c.lineTo(cx+span,cy);c.stroke();for(let i=0;i<bars;i++){const q=i/(bars-1),voice=Math.abs(Math.sin(t*6.2+i*.73))*.46+Math.abs(Math.sin(t*2.3+i*.31))*.29+Math.abs(Math.sin(t*11.7+i*1.07))*.25,env=.4+.6*Math.abs(Math.sin(t*.91+i*.04)),edge=Math.pow(Math.sin(q*Math.PI),.42),amp=h*.22*edge*(.1+m*voice*env),x=(i+.5)*(span/bars),a=.3+.6*edge;c.fillStyle=`rgba(0,255,120,${a})`;c.fillRect(cx+x,cy-amp,bw,amp*2);c.fillRect(cx-x-bw,cy-amp,bw,amp*2)}const p=(.5+.5*Math.sin(t*3.4))*m;c.strokeStyle=`rgba(0,255,150,${.22+p*.42})`;c.lineWidth=Math.max(1.2*d,2);c.beginPath();c.arc(cx,cy,(24+p*34)*d,0,Math.PI*2);c.stroke();audioScopeFrame=requestAnimationFrame(drawAudioScope)}
function startAudioScope(item){buildRadioStars(item.n);audioStage.classList.add('active');if(audioScopeFrame===null)audioScopeFrame=requestAnimationFrame(drawAudioScope)}
function stopAudioScope(){audioStage.classList.remove('active');if(audioScopeFrame!==null){cancelAnimationFrame(audioScopeFrame);audioScopeFrame=null}}

window.addEventListener('resize',()=>{if(audioStage.classList.contains('active'))resizeAudioScope()});


window.addEventListener('pagehide',savePosition);
document.addEventListener('visibilitychange',()=>{if(document.hidden)savePosition();});
window.addEventListener('hashchange',()=>{const p=parseSelection(location.hash);if(p)choose(p.ci,p.vi,{time:p.time,delay:false});else if(p===false)setStatus('That shared program is not in this catalog. Open Guide to choose one.');});
window.onload=async()=>{
    try{
        await loadChannelLibrary();
        makeTicks('t-ring',100);makeTicks('s-ring',categories.length);
        enableKnobSwipe(document.getElementById('t-knob'),tune);enableKnobSwipe(document.getElementById('s-knob'),changeCategory);
        const volume=preferences.volume;
        volumeKnob.value=String(typeof volume==='number'&&Number.isFinite(volume)&&volume>=0&&volume<=1?volume:0.7);
        categories.forEach(c=>{
            const o=document.createElement('option');
            o.value=c.name;o.textContent=`CH ${c.name} · ${c.label}`;
            document.getElementById('guide-channel').appendChild(o);
        });
        const p=parseSelection(location.hash);
        if(p) choose(p.ci,p.vi,{time:p.time,delay:false});
        else {
            const fallback=categories.findIndex(c=>c.name===preferences.lastChannel);
            const ci=fallback>=0?fallback:0;
            const saved=savedChannel(categories[ci]);
            const vi=Math.max(0,programIds[ci].indexOf(saved.id));
            choose(ci,vi,{delay:false});
            if(p===false)setStatus('Shared program not found. Open Guide to choose one.');
        }
    }catch(error){
        console.error("CLINE TV catalog load failed:",error);
        document.getElementById('osd').textContent="CATALOG OFFLINE\\nCHANNEL LIBRARY COULD NOT BE LOADED";
        document.getElementById('osd').style.opacity='1';
    }
};

</script>
